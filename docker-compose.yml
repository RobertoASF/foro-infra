name: foro

services:
  ms-usuarios:
    build: ../foro-ms-usuarios
    container_name: foro-ms-usuarios
    environment:
      DB_URL: jdbc:oracle:thin:@${DB_ALIAS}?TNS_ADMIN=/wallet
      DB_USUARIO: foro_usuarios
      DB_PASSWORD: ${DB_USUARIOS_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
      CORS_ORIGEN: ${CORS_ORIGEN}
      LOG_NIVEL: DEBUG
      TZ: America/Santiago
    volumes:
      - ${WALLET_DIR}:/wallet:ro
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ms-publicaciones:
    build: ../foro-ms-publicaciones
    container_name: foro-ms-publicaciones
    environment:
      DB_URL: jdbc:oracle:thin:@${DB_ALIAS}?TNS_ADMIN=/wallet
      DB_USUARIO: foro_publicaciones
      DB_PASSWORD: ${DB_PUBLICACIONES_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
      CORS_ORIGEN: ${CORS_ORIGEN}
      LOG_NIVEL: DEBUG
      TZ: America/Santiago
    volumes:
      - ${WALLET_DIR}:/wallet:ro
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Tarea de una sola vez. Esta imagen se usa solo porque trae SQL*Plus.
  cargar-bd:
    image: gvenzl/oracle-free:23-slim-faststart
    profiles: ["carga"]
    entrypoint: ["bash", "/scripts/cargar_bd.sh"]
    environment:
      DB_ALIAS: ${DB_ALIAS}
      ORACLE_ADMIN_PASSWORD: ${ORACLE_ADMIN_PASSWORD}
      DB_USUARIOS_PASSWORD: ${DB_USUARIOS_PASSWORD}
      DB_PUBLICACIONES_PASSWORD: ${DB_PUBLICACIONES_PASSWORD}
    volumes:
      - ${WALLET_DIR}:/wallet:ro
      - ./db:/scripts:ro
      - ../foro-ms-usuarios/db:/sql/usuarios:ro
      - ../foro-ms-publicaciones/db:/sql/publicaciones:ro
